# Shell rules for agents working in this repository (AGENTS.md, "Workflow").
# RustCode's command guard reads this file: see docs/command-guard.md.
# A deny rule refuses the command and tells the agent why; a rewrite rule runs
# it with a prefix. Rules look through quotes, `&&` lists, `VAR=x` prefixes and
# wrappers such as `timeout`, `env` or `sh -c`.

[[rule]]
name = "no-local-tests"
action = "deny"
program = "cargo"
subcommand = ["test", "t", "nextest"]
allow_env = "RUSTCODE_ALLOW_LOCAL_TESTS"
message = "Tests run in CI, not on this laptop: building the engine's tests took 4–7 minutes per run and drained the battery. Run `cargo check --workspace --tests` and `cargo fmt --all -- --check`, push, then read `gh pr checks <n>` and `gh run view <run> --log-failed`. Reproducing a CI failure the log cannot explain is the one reason to run a single test locally."

[[rule]]
name = "cargo-low-priority"
action = "rewrite"
program = "cargo"
subcommand = ["build", "b", "check", "c", "clippy", "test", "t", "nextest", "run", "r", "bench", "doc", "fix", "install", "rustc"]
prefix_macos = "nice -n 10"
prefix_linux = "nice -n 10"
skip_if_wrapped = ["taskpolicy", "nice"]
message = "Cargo runs at nice 10: it yields to the user's work but keeps every core. Not `taskpolicy -b`, which confines a build to the efficiency cores on Apple silicon."

[[rule]]
name = "no-git-rebase"
action = "deny"
program = "git"
subcommand = ["rebase"]
message = "Never rebase a task branch. Merge `origin/main` with `git merge origin/main --no-edit` when the branch needs updating."

[[rule]]
name = "no-git-stash"
action = "deny"
program = "git"
subcommand = ["stash"]
message = "The stash is shared with every worktree and other threads. Set work aside with a temporary WIP commit instead."

[[rule]]
name = "no-git-reset-hard"
action = "deny"
program = "git"
subcommand = ["reset"]
flags = ["--hard"]
message = "`git reset --hard` discards work. Use `git restore <path>` for one file, or ask the user."

[[rule]]
name = "no-force-push"
action = "deny"
program = "git"
subcommand = ["push"]
flags = ["--force", "-f", "--force-with-lease"]
message = "Never force-push. Merge `origin/main` into the branch and push normally."
