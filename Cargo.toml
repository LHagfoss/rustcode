[package]
name = "rustcode"
version = "0.56.15"
edition = "2024"
license = "Apache-2.0"

[workspace]
members = [
    # Core libraries: no terminal UI, no frontend assumptions.
    "rustcode/core/rustcode-core",
    "rustcode/core/rustcode-session",
    "rustcode/core/rustcode-tool-protocol",
    "rustcode/core/rustcode-tools",
    "rustcode/core/rustcode-command",
    "rustcode/core/rustcode-lifecycle",
    "rustcode/core/rustcode-tasks",
    "rustcode/core/rustcode-loop-detect",
    # The engine is the root package itself: agent loop, tools, config,
    # session state, ACP, daemon, and the terminal frontend behind `tui`.
    # Terminal frontend (TUI + CLI modes).
    "rustcode/tui",
    # Native desktop shell (GPUI).
    "rustcode/desktop",
]
resolver = "3"

[lib]
name = "rustcode"
path = "rustcode/engine/src/lib.rs"

[dependencies]
anyhow = "1.0.97"
agent-client-protocol = "2.0.0"
base64 = "0.22.1"
chrono = { version = "0.4.39", default-features = false, features = ["clock", "serde", "std"] }
chrono-tz = { version = "0.10.4", features = ["serde"] }
clap = { version = "4.6.4", features = ["derive"] }
cron = "0.15.0"
discord-rich-presence = "=0.2.4"
futures-util = "0.3.32"
fs2 = "0.4.3"
globset = "0.4"
ignore = "0.4"
jsonwebtoken = { version = "9", default-features = false, features = ["use_pem"] }
keyring = { version = "3.6", default-features = false, features = ["apple-native", "windows-native", "async-secret-service", "tokio", "crypto-rust"] }
rand = "0.10.2"
regex = "1"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "form", "stream", "rustls"] }
reqwest-middleware = "0.4.2"
rusqlite = { version = "0.32.1", features = ["bundled"] }
scraper = "0.22.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
similar = { version = "3.1.1", features = ["inline"] }
streaming-iterator = "0.1.9"
sysinfo = "0.39.6"
tokio = { version = "1.52.3", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-stream = "0.1.16"
tokio-util = { version = "0.7.18", features = ["io"] }
tiktoken-rs = "0.5.9"
toml = "0.8.19"
tree-sitter = "0.24.4"
tree-sitter-rust = "0.23.2"
urlencoding = "2.1.3"
url = "2"
open = "5"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
serde_millis = "0.1.1"
sha2 = "0.10"
tree-sitter-python = "0.23.6"
tree-sitter-typescript = "0.23.2"
tree-sitter-javascript = "0.23.1"
tree-sitter-go = "0.23.4"
flate2 = "1.0"
libc = "0.2"
tar = "0.4"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
tempfile = "3.10"
rustcode-core = { path = "rustcode/core/rustcode-core" }
rustcode-session = { path = "rustcode/core/rustcode-session" }
rustcode-tool-protocol = { path = "rustcode/core/rustcode-tool-protocol" }
rustcode-tools = { path = "rustcode/core/rustcode-tools" }
rustcode-command = { path = "rustcode/core/rustcode-command" }
rustcode-lifecycle = { path = "rustcode/core/rustcode-lifecycle" }
rustcode-loop-detect = { path = "rustcode/core/rustcode-loop-detect" }
rustcode-tasks = { path = "rustcode/core/rustcode-tasks" }
# Optimize dependencies even in debug builds — syntect, pulldown-cmark,
# unicode-width, and tui-markdown are 5-10x slower at opt-level=0 and
# dominate scroll latency in long sessions. Our own code stays at opt-level=0
# for fast compilation and full debuginfo.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
strip = true
incremental = false
debug = false
overflow-checks = false

[dev-dependencies]
tokio = { version = "1.52.3", features = ["test-util"] }
