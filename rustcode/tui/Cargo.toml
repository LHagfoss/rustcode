[package]
name = "rustcode-tui"
version = "0.64.0"
edition = "2024"
license = "Apache-2.0"

[[bin]]
name = "rustcode"
path = "src/main.rs"

[dependencies]
# Core library without the (now empty) default feature set: the terminal
# frontend brings its own renderer instead of the root package's.
rustcode = { path = "../..", default-features = false }
rustcode-core = { path = "../core/rustcode-core" }
rustcode-tool-protocol = { path = "../core/rustcode-tool-protocol" }
rustcode-command = { path = "../core/rustcode-command" }
rustcode-tasks = { path = "../core/rustcode-tasks" }
clap = { version = "4.6.4", features = ["derive"] }
chrono = { version = "0.4.39", default-features = false, features = ["clock", "std"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
iana-time-zone = "0.1.65"
futures-util = "0.3.32"
libc = "0.2"
pulldown-cmark = { version = "0.12.2" }
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "stream", "rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
syntect = "5.2"
toml = "0.8.19"
tokio = { version = "1.52.3", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7.18", features = ["io"] }
unicode-width = "0.2.2"
unicode-segmentation = "1.12"

[dev-dependencies]
ctor = "1.0.13"
tokio = { version = "1.52.3", features = ["test-util"] }
