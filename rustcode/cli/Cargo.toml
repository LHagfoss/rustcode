[package]
name = "rustcode-cli"
version = "1.54.0"
edition = "2024"
license = "Apache-2.0"

[[bin]]
name = "rc"
path = "src/main.rs"

[dependencies]
rustcode = { path = "../..", default-features = false }
rustcode-client = { path = "../client" }
rustcode-core = { path = "../core/rustcode-core" }
anyhow = "1.0.97"
clap = { version = "4.6.4", features = ["derive"] }
chrono = { version = "0.4.39", default-features = false, features = ["clock", "std"] }
iana-time-zone = "0.1.65"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "stream", "rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
toml = "0.8.19"
tokio = { version = "1.52.3", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7.18", features = ["io"] }

[dev-dependencies]
ctor = "1.0.13"
libc = "0.2"
tempfile = "3.10"
tokio = { version = "1.52.3", features = ["test-util"] }
