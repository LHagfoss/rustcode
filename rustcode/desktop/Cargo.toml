[package]
name = "rustcode-app"
version = "0.92.1"
edition = "2024"

[dependencies]
rustcode = { path = "../.." }
chrono = { version = "0.4.39", default-features = false, features = ["clock", "std"] }
gpui-kit = "=0.6.6"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "sync"] }
syntect = "5.2"

[dev-dependencies]
gpui-kit = { version = "=0.6.6", features = ["test-support"] }
