name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify tag metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          xcodebuild -project RustCode.xcodeproj -scheme RustCode -configuration Release -destination 'generic/platform=iOS' -showBuildSettings -json > /tmp/release-settings.json
          version=$(python3 Scripts/ios-release-support.py metadata /tmp/release-settings.json | head -1)
          test "$RELEASE_TAG" = "v$version"
      - name: Test remote client and contract
        run: swift test --package-path RustCodeRemote
      - name: Test release installers without hardware
        run: |
          python3 tests/test_ios_release_helpers.py
          python3 tests/test_github_ios_install.py
      - name: Build Simulator release
        run: >-
          xcodebuild -quiet -project RustCode.xcodeproj -scheme RustCode
          -configuration Release -destination 'generic/platform=iOS Simulator'
          -derivedDataPath /tmp/RustCodeSimulator
          build CODE_SIGNING_ALLOWED=NO DEVELOPMENT_TEAM=
      - name: Archive unsigned iOS release
        run: >-
          xcodebuild -quiet -project RustCode.xcodeproj -scheme RustCode
          -configuration Release -destination 'generic/platform=iOS'
          -archivePath /tmp/RustCode.xcarchive
          archive CODE_SIGNING_ALLOWED=NO DEVELOPMENT_TEAM=
      - name: Package public artifacts
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent /tmp/RustCodeSimulator/Build/Products/Release-iphonesimulator/RustCode.app dist/RustCode-iOS-Simulator.zip
          ditto -c -k --sequesterRsrc --keepParent /tmp/RustCode.xcarchive dist/RustCode-iOS-unsigned.xcarchive.zip
          cd dist
          shasum -a 256 *.zip > SHA256SUMS
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
