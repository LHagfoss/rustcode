[package]
name = "rustcode-session"
version = "0.55.11"
edition = "2024"
license = "Apache-2.0"

[dependencies]
rustcode-core = { path = "../rustcode-core" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
chrono = { version = "0.4.39", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
tempfile = "3.10"
