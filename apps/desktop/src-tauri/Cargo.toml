[package]
name = "rustcode-desktop"
version = "0.1.0"
description = "RustCode desktop app: a Tauri shell around the rustcode --acp engine"
edition = "2021"
publish = false

# Its own workspace: the repository's root workspace excludes this crate, so
# the engine's `cargo check --workspace` never builds the desktop shell.
[workspace]

[lib]
name = "rustcode_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
# macos-private-api: the transparent window behind the sidebar vibrancy (tauri.conf.json).
tauri = { version = "=2.12.5", features = ["macos-private-api"] }
tauri-plugin-dialog = "=2.8.4"
# System notifications for a thread that needs the user (src/notify.rs).
tauri-plugin-notification = "=2.8.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
# Checks a downloaded update against the release SHA256SUMS (src/updater.rs); the version tauri already uses.
sha2 = "0.10"
# Link previews: fetched here, never by the webview (src/links.rs).
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
tokio = { version = "1", features = ["net", "time"] }
# The workspace terminal (src/pty.rs).
portable-pty = "0.9"

# The web view's frame-rate preference (src/webview.rs); the versions tauri/wry already use.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-web-kit = { version = "=0.3.2", default-features = false, features = ["WKWebViewConfiguration", "WKPreferences"] }

# Windows 11's Mica (src/webview.rs), the version tauri 2.12.5 already builds: its `Result` is the
# only true answer to "did the material take", which tauri's own `set_effects` throws away.
[target.'cfg(target_os = "windows")'.dependencies]
window-vibrancy = "=0.8.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[profile.dev]
incremental = false
