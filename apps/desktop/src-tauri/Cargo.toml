[package]
name = "rustcode-desktop"
version = "0.1.0"
description = "RustCode desktop app: a Tauri shell around the rustcode --acp engine"
edition = "2021"
publish = false

# Its own workspace: the repository's root workspace excludes this crate, so
# the engine's `cargo check --workspace` never builds the desktop shell.
[workspace]

[lib]
name = "rustcode_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
# macos-private-api: the transparent window behind the sidebar vibrancy (tauri.conf.json).
tauri = { version = "=2.12.5", features = ["macos-private-api"] }
tauri-plugin-dialog = "=2.8.4"
# System notifications for a thread that needs the user (src/notify.rs).
tauri-plugin-notification = "=2.8.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
# Machines: the error chain from the machine client, and the times the
# registry records (src/machines.rs).
anyhow = "1"
chrono = { version = "0.4.39", default-features = false, features = ["clock", "std"] }
# The machine client: saved machines, pairing, and the WebSocket to another
# machine's gateway (src/machines.rs).
rustcode-client = { path = "../../../rustcode/client" }
# This computer's own interface addresses, so a machine that went offline is
# retried the moment the network changes (src/machines.rs).
if-addrs = "0.15"
# Checks a downloaded update against the release SHA256SUMS (src/updater.rs); the version tauri already uses.
sha2 = "0.10"
# Link previews: fetched here, never by the webview (src/links.rs).
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
tokio = { version = "1", features = ["net", "time", "sync"] }
# The workspace terminal (src/pty.rs).
portable-pty = "0.9"
# The picture on the system clipboard (src/native.rs `clipboard_image`): WebKitGTK on Linux shows a
# copied screenshot to no paste event at all, so the composer asks the shell for it. Wayland needs
# its data-control protocol; without it the read goes through X11.
arboard = { version = "3.6", features = ["wayland-data-control"] }
# A clipboard image arrives as raw RGBA and attaches as PNG (src/native.rs).
png = "0.18"
# A trashed thread goes to the system's own Trash (Recycle Bin, freedesktop
# Trash, the macOS volume's Trash), where it can be put back.
trash = "5.3"

# The web view's frame-rate preference (src/webview.rs); the versions tauri/wry already use.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-web-kit = { version = "=0.3.2", default-features = false, features = ["WKWebViewConfiguration", "WKPreferences"] }


[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

# Incremental compilation stays on (cargo's default), as in the root
# workspace: with it off, a one-file edit rebuilt the whole app crate.

# Symbols out of the shipped binary: the Linux build kept them, 40 MB where
# 29 MB runs the same. The root workspace's release profile strips too.
[profile.release]
strip = true
