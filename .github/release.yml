changelog:
    # Titles must NOT include a leading "###" — GitHub already renders each
    # category title as a heading, so "### Features" produced "### ### Features".
    # Labels here are kept in sync with .github/workflows/pr-label.yml, which
    # maps the Conventional Commit prefix in a PR title to these labels.
    categories:
        - title: Features
          labels:
              - feature
              - enhancement
        - title: Fixes
          labels:
              - fix
              - bug
        - title: Performance
          labels:
              - performance
        - title: Refactor
          labels:
              - refactor
        - title: UI
          labels:
              - ui
              - design
        - title: Documentation
          labels:
              - documentation
        - title: Tests
          labels:
              - test
        - title: Build & CI
          labels:
              - build
              - ci
        - title: Chores
          labels:
              - chore
              - dependencies
        - title: Breaking changes
          labels:
              - breaking
        - title: Other Changes
          labels:
              - "*"
