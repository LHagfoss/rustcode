permissions:
    contents: write

name: Build

on:
    push:
        tags: ["v*"]
        # Builds on main only warm the Rust and sccache caches: GitHub scopes
        # caches by ref, and a tag build can restore main's but never another
        # tag's, so without these every release compiled from scratch. Path
        # filters do not apply to tag pushes.
        branches: [main]
        paths:
            - .github/workflows/build.yml
            - Cargo.toml
            - Cargo.lock
            - rustcode/**
            - "!rustcode/**/*.md"
    workflow_dispatch:

concurrency:
    group: build-${{ github.ref }}
    # A newer merge supersedes a cache warm-up; never cancel a release.
    cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

env:
    CARGO_TERM_COLOR: always
    SCCACHE_GHA_ENABLED: "true"
    RUSTC_WRAPPER: "sccache"

jobs:
    verify-tag:
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository history
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Verify tagged commit is on main
              shell: bash
              run: |
                  if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
                      exit 0
                  fi

                  git fetch origin main --no-tags
                  if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/main"; then
                      echo "Tag commit $GITHUB_SHA is not reachable from origin/main."
                      echo "Publish tags only after merging the release PR."
                      exit 1
                  fi

    build:
        needs: verify-tag
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-24.04
                      target: x86_64-unknown-linux-gnu
                      name: rustcode-linux-x86_64
                    - os: ubuntu-24.04-arm
                      target: aarch64-unknown-linux-gnu
                      name: rustcode-linux-aarch64
                    - os: macos-latest
                      target: aarch64-apple-darwin
                      name: rustcode-macos-aarch64
                    - os: windows-latest
                      target: x86_64-pc-windows-msvc
                      name: rustcode-windows-x86_64

        steps:
            - uses: actions/checkout@v7

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.target }}

            - name: Rust Cache
              uses: Swatinem/rust-cache@v2
              with:
                  shared-key: ${{ matrix.target }}

            - name: Configure shared compiler cache
              uses: mozilla-actions/sccache-action@v0.0.11

            - name: Set up mold linker (Linux)
              if: runner.os == 'Linux'
              uses: rui314/setup-mold@v1

            - name: Build release
              shell: bash
              env:
                  # ThinLTO makes the Windows MSVC release link disproportionately slow.
                  # Keep the optimized release profile, but skip LTO for this platform.
                  CARGO_PROFILE_RELEASE_LTO: ${{ runner.os == 'Windows' && 'off' || 'thin' }}
              # The `rustcode` binary is built by the rustcode-tui package;
              # the root package is a library since the TUI extraction.
              run: cargo build --locked --release --target ${{ matrix.target }} -p rustcode-tui

            - name: Show compiler cache stats
              if: always()
              shell: bash
              run: ${SCCACHE_PATH} --show-stats

            # Developer ID signing switches on once all five MACOS_* secrets
            # exist (docs/macos-release-signing.md); until then the binary
            # ships as the linker signed it and this prints a notice.
            - name: Check macOS signing secrets
              id: signing
              if: (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && runner.os == 'macOS'
              shell: bash
              env:
                  MACOS_DEVELOPER_ID_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
                  MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
                  MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
                  MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
                  MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
              run: scripts/macos-release-signing.sh check

            - name: Import Developer ID certificate
              if: steps.signing.outputs.enabled == 'true'
              shell: bash
              env:
                  MACOS_DEVELOPER_ID_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
                  MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
                  MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
                  MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
                  MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
              run: scripts/macos-release-signing.sh import

            # A bare executable cannot be stapled: it is signed and submitted,
            # and Gatekeeper finds the ticket online.
            - name: Sign and notarize macOS binary
              if: steps.signing.outputs.enabled == 'true'
              shell: bash
              env:
                  MACOS_DEVELOPER_ID_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
                  MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
                  MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
                  MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
                  MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
              run: |
                  scripts/macos-release-signing.sh sign target/${{ matrix.target }}/release/rustcode
                  ditto -c -k --keepParent target/${{ matrix.target }}/release/rustcode "$RUNNER_TEMP/rustcode-cli-notarize.zip"
                  scripts/macos-release-signing.sh notarize "$RUNNER_TEMP/rustcode-cli-notarize.zip"

            - name: Remove signing keychain
              if: always() && steps.signing.outputs.enabled == 'true'
              shell: bash
              run: scripts/macos-release-signing.sh cleanup

            - name: Package Linux / macOS binary
              if: (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && runner.os != 'Windows'
              shell: bash
              run: |
                  cp target/${{ matrix.target }}/release/rustcode ${{ matrix.name }}
                  chmod +x ${{ matrix.name }}
                  tar czf ${{ matrix.name }}.tar.gz -C . ${{ matrix.name }}

            - name: Package Windows binary
              if: (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && runner.os == 'Windows'
              shell: powershell
              run: |
                  Copy-Item "target/${{ matrix.target }}/release/rustcode.exe" "${{ matrix.name }}.exe"
                  Compress-Archive -Path "${{ matrix.name }}.exe" -DestinationPath "${{ matrix.name }}.zip"

            - name: Upload artifact
              if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
              uses: actions/upload-artifact@v7
              with:
                  name: ${{ matrix.name }}
                  # Each runner produces only one of these archives;
                  # unmatched patterns are skipped, not an error.
                  path: |
                      ${{ matrix.name }}.tar.gz
                      ${{ matrix.name }}.zip

    # Build Swift sources only on macOS and reuse the arm64 engine artifact,
    # avoiding another Rust compile and leaving Linux/Windows jobs unchanged.
    swift-app:
        needs: build
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        runs-on: macos-26
        steps:
            - uses: actions/checkout@v7

            - name: Download arm64 engine archive
              uses: actions/download-artifact@v8
              with:
                  name: rustcode-macos-aarch64
                  path: engine

            - name: Test Swift package
              run: swift test --package-path macos

            # Without the MACOS_* secrets the app stays ad-hoc signed and
            # unnotarized (docs/macos-release-signing.md).
            - name: Check macOS signing secrets
              id: signing
              env:
                  MACOS_DEVELOPER_ID_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
                  MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
                  MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
                  MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
                  MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
              run: scripts/macos-release-signing.sh check

            - name: Import Developer ID certificate
              if: steps.signing.outputs.enabled == 'true'
              env:
                  MACOS_DEVELOPER_ID_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
                  MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
                  MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
                  MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
                  MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
              run: scripts/macos-release-signing.sh import

            # Signs with MACOS_SIGN_IDENTITY when the import set it, else ad hoc.
            - name: Package SwiftUI app
              run: |
                  tar xzf engine/rustcode-macos-aarch64.tar.gz -C engine
                  chmod +x engine/rustcode-macos-aarch64
                  REQUIRE_COMPILED_ICON=1 scripts/package-swift-app.sh engine/rustcode-macos-aarch64 target/swift-release

            - name: Notarize and staple SwiftUI app
              if: steps.signing.outputs.enabled == 'true'
              env:
                  MACOS_DEVELOPER_ID_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
                  MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
                  MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
                  MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
                  MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
              run: scripts/macos-release-signing.sh notarize target/swift-release/RustCode.app

            - name: Zip SwiftUI app
              run: ditto -c -k --sequesterRsrc --keepParent target/swift-release/RustCode.app rustcode-macos-aarch64-swift-app.zip

            # Check the asset as a user gets it: unpacked from the zip, with
            # the quarantine flag a browser download sets.
            - name: Verify downloaded app with Gatekeeper
              if: steps.signing.outputs.enabled == 'true'
              run: |
                  check="$RUNNER_TEMP/gatekeeper-check"
                  rm -rf "$check" && mkdir -p "$check"
                  ditto -x -k rustcode-macos-aarch64-swift-app.zip "$check"
                  xattr -w com.apple.quarantine "0083;$(printf '%x' "$(date +%s)");Safari;" "$check/RustCode.app"
                  xcrun stapler validate "$check/RustCode.app"
                  spctl --assess --type execute --verbose=4 "$check/RustCode.app"
                  codesign --verify --deep --strict --verbose=2 "$check/RustCode.app"

            - name: Remove signing keychain
              if: always() && steps.signing.outputs.enabled == 'true'
              run: scripts/macos-release-signing.sh cleanup

            - name: Upload app artifact
              uses: actions/upload-artifact@v7
              with:
                  name: rustcode-macos-aarch64-swift-app
                  path: rustcode-macos-aarch64-swift-app.zip

    # The iOS app in ios/ ships under the same version. Its archive is unsigned:
    # ios/Scripts/install-on-iphone.sh re-signs it locally with the user's profile.
    ios-app:
        needs: verify-tag
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        runs-on: macos-26
        defaults:
            run:
                working-directory: ios
        steps:
            - uses: actions/checkout@v7

            - name: Verify app version
              if: startsWith(github.ref, 'refs/tags/v')
              env:
                  RELEASE_TAG: ${{ github.ref_name }}
              run: |
                  xcodebuild -project RustCode.xcodeproj -scheme RustCode -configuration Release -destination 'generic/platform=iOS' -showBuildSettings -json > /tmp/release-settings.json
                  version=$(python3 Scripts/ios-release-support.py metadata /tmp/release-settings.json | head -1)
                  test "$RELEASE_TAG" = "v$version"

            - name: Test remote client and installers
              run: |
                  swift test --package-path RustCodeRemote
                  python3 tests/test_ios_release_helpers.py
                  python3 tests/test_github_ios_install.py

            - name: Build Simulator app and unsigned device archive
              run: |
                  xcodebuild -quiet -project RustCode.xcodeproj -scheme RustCode \
                      -configuration Release -destination 'generic/platform=iOS Simulator' \
                      -derivedDataPath /tmp/RustCodeSimulator build CODE_SIGNING_ALLOWED=NO DEVELOPMENT_TEAM=
                  xcodebuild -quiet -project RustCode.xcodeproj -scheme RustCode \
                      -configuration Release -destination 'generic/platform=iOS' \
                      -archivePath /tmp/RustCode.xcarchive archive CODE_SIGNING_ALLOWED=NO DEVELOPMENT_TEAM=
                  ditto -c -k --sequesterRsrc --keepParent /tmp/RustCodeSimulator/Build/Products/Release-iphonesimulator/RustCode.app ../rustcode-ios-simulator.zip
                  ditto -c -k --sequesterRsrc --keepParent /tmp/RustCode.xcarchive ../rustcode-ios-unsigned.xcarchive.zip

            - name: Upload iOS artifacts
              uses: actions/upload-artifact@v7
              with:
                  name: rustcode-ios
                  path: |
                      rustcode-ios-simulator.zip
                      rustcode-ios-unsigned.xcarchive.zip

    release:
        if: startsWith(github.ref, 'refs/tags/v')
        needs: [build, swift-app, ios-app]
        runs-on: ubuntu-latest
        steps:
            - name: Download artifacts
              uses: actions/download-artifact@v8
              with:
                  # Removed the trailing slash to correctly flatten files
                  # when using merge-multiple: true
                  path: artifacts
                  merge-multiple: true

            - name: Generate SHA256 manifest
              shell: bash
              run: |
                  set -euo pipefail
                  cd artifacts
                  files=(
                      rustcode-linux-aarch64.tar.gz
                      rustcode-linux-x86_64.tar.gz
                      rustcode-macos-aarch64.tar.gz
                      rustcode-macos-aarch64-swift-app.zip
                      rustcode-ios-simulator.zip
                      rustcode-ios-unsigned.xcarchive.zip
                      rustcode-windows-x86_64.zip
                  )
                  for file in "${files[@]}"; do
                      test -f "$file"
                  done
                  sha256sum "${files[@]}" | LC_ALL=C sort -k2,2 > SHA256SUMS

            - name: Create GitHub Release
              id: create_release
              uses: softprops/action-gh-release@v2
              with:
                  # Targets only the archives inside the root artifacts directory
                  files: |
                      artifacts/SHA256SUMS
                      artifacts/*.tar.gz
                      artifacts/*.zip
                  generate_release_notes: true

            - name: Update Homebrew Formula
              env:
                  TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
                  TAG: ${{ github.ref_name }}
                  GH_USER: "lhagfoss"
              run: |
                  # 1. Read the platform-specific hashes from the published manifest.
                  ARM_SHA256=$(awk '$2 == "rustcode-macos-aarch64.tar.gz" {print $1}' artifacts/SHA256SUMS)
                  test -n "$ARM_SHA256"
                  echo "Computed ARM64 SHA256: $ARM_SHA256"

                  # 2. Clone your tap repository
                  git clone "https://x-access-token:${TAP_TOKEN}@github.com/${GH_USER}/homebrew-tap.git" tap-repo
                  cd tap-repo

                  # 3. Create Formula directory if it doesn't exist yet
                  mkdir -p Formula

                  # 4. Overwrite the formula file with the latest release info
                  cat <<EOF > Formula/rustcode.rb
                  class Rustcode < Formula
                      desc "Local LLM Agent Harness"
                      homepage "https://github.com/${GH_USER}/rustcode"
                      url "https://github.com/${GH_USER}/rustcode/releases/download/${TAG}/rustcode-macos-aarch64.tar.gz"
                      sha256 "${ARM_SHA256}"
                      depends_on arch: :arm64

                      version "${TAG/v/}"

                      def install
                          bin.install "rustcode-macos-aarch64" => "rustcode"
                      end
                  end
                  EOF

                  # 5. Commit and push the formula changes back to your tap repo
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git add Formula/rustcode.rb
                  git commit -m "Update rustcode to ${TAG}"
                  git push origin main
