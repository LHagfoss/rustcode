permissions:
    contents: write
    # The desktop jobs poll this run's artifacts for the engine they bundle.
    actions: read

name: Build

on:
    push:
        tags: ["v*"]
        # Builds on main only warm the Rust and sccache caches: GitHub scopes
        # caches by ref, and a tag build can restore main's but never another
        # tag's, so without these every release compiled from scratch. Path
        # filters do not apply to tag pushes.
        branches: [main]
        paths:
            - .github/workflows/build.yml
            - Cargo.toml
            - Cargo.lock
            - rustcode/**
            - "!rustcode/**/*.md"
    workflow_dispatch:

concurrency:
    group: build-${{ github.ref }}
    # A newer merge supersedes a cache warm-up; never cancel a release.
    cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

env:
    CARGO_TERM_COLOR: always
    SCCACHE_GHA_ENABLED: "true"
    RUSTC_WRAPPER: "sccache"

jobs:
    verify-tag:
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository history
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Verify tagged commit is on main
              shell: bash
              run: |
                  if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
                      exit 0
                  fi

                  git fetch origin main --no-tags
                  if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/main"; then
                      echo "Tag commit $GITHUB_SHA is not reachable from origin/main."
                      echo "Publish tags only after merging the release PR."
                      exit 1
                  fi

    # macOS on its own, so desktop-macos and the release wait only for it.
    build-macos:
        needs: verify-tag
        uses: ./.github/workflows/build-rust.yml
        secrets: inherit
        with:
            matrix: '[{"os": "macos-latest", "target": "aarch64-apple-darwin", "name": "rustcode-macos-aarch64"}]'

    # Skipped for a beta (a `vX.Y.Z-beta.N` tag): a beta ships the
    # macOS CLI and app only, as a GitHub prerelease.
    build:
        needs: verify-tag
        if: ${{ !(startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-')) }}
        uses: ./.github/workflows/build-rust.yml
        secrets: inherit
        with:
            matrix: >-
                [{"os": "ubuntu-24.04", "target": "x86_64-unknown-linux-gnu", "name": "rustcode-linux-x86_64"},
                 {"os": "ubuntu-24.04-arm", "target": "aarch64-unknown-linux-gnu", "name": "rustcode-linux-aarch64"},
                 {"os": "windows-latest", "target": "x86_64-pc-windows-msvc", "name": "rustcode-windows-x86_64"}]

    # The desktop app (apps/desktop, Tauri) as RustCode.app, on macOS only so
    # the release waits for nothing else. It reuses the arm64 engine artifact
    # as its sidecar instead of compiling the engine again. A beta builds it
    # too.
    desktop-macos:
        # Starts with the engine build, not after it: the shell compiles
        # against a placeholder sidecar, then waits for the engine artifact
        # and only bundles (a relink) once it lands.
        needs: verify-tag
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        # Xcode 26's actool compiles the layered icon (apps/desktop/scripts/app-icon.ts).
        runs-on: macos-26
        steps:
            - uses: actions/checkout@v7

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.14

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable

            - name: Cache the shell crate
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: apps/desktop/src-tauri

            - name: Configure shared compiler cache
              uses: mozilla-actions/sccache-action@v0.0.11

            - name: Compile the app while the engine builds
              working-directory: apps/desktop
              run: |
                  mkdir -p src-tauri/binaries
                  printf '#!/bin/sh\n' > src-tauri/binaries/rustcode-aarch64-apple-darwin
                  chmod 755 src-tauri/binaries/rustcode-aarch64-apple-darwin
                  bun install --frozen-lockfile
                  bun run bundle:app --no-bundle

            # Waits for the engine artifact of this run (the desktop app compiled meanwhile).
            - name: Wait for the engine build
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
                  ARTIFACT: rustcode-macos-aarch64
              run: |
                  for _ in $(seq 1 160); do
                      names="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" --jq '.artifacts[].name')"
                      if grep -qx "$ARTIFACT" <<<"$names"; then exit 0; fi
                      failed="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" --jq '[.jobs[] | select((.name | contains(env.ARTIFACT)) and (.conclusion == "failure" or .conclusion == "cancelled"))] | length')"
                      if [ "$failed" != 0 ]; then echo "The engine build for $ARTIFACT failed."; exit 1; fi
                      sleep 15
                  done
                  echo "The engine artifact $ARTIFACT did not appear in 40 minutes."
                  exit 1

            - name: Download arm64 engine archive
              uses: actions/download-artifact@v8
              with:
                  name: rustcode-macos-aarch64
                  path: engine

            - name: Place the engine sidecar
              run: |
                  tar xzf engine/rustcode-macos-aarch64.tar.gz -C engine
                  install -m 755 engine/rustcode-macos-aarch64 apps/desktop/src-tauri/binaries/rustcode-aarch64-apple-darwin

            # Without the MACOS_* secrets the app stays ad-hoc signed and
            # unnotarized (docs/macos-release-signing.md).
            - name: Check macOS signing secrets
              id: signing
              env:
                  MACOS_DEVELOPER_ID_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
                  MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
                  MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
                  MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
                  MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
              run: scripts/macos-release-signing.sh check

            - name: Import Developer ID certificate
              if: steps.signing.outputs.enabled == 'true'
              env:
                  MACOS_DEVELOPER_ID_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
                  MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
                  MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
                  MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
                  MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
              run: scripts/macos-release-signing.sh import

            # Tauri signs the sidecar and the bundle with the hardened runtime:
            # with the imported Developer ID when there is one, else ad hoc
            # (tauri.bundle.conf.json's signingIdentity "-").
            - name: Build RustCode.app
              working-directory: apps/desktop
              run: |
                  bun install --frozen-lockfile
                  if [ -n "${MACOS_SIGN_IDENTITY:-}" ]; then export APPLE_SIGNING_IDENTITY="$MACOS_SIGN_IDENTITY"; fi
                  bun run bundle:app --bundles app

            - name: Verify app version
              if: startsWith(github.ref, 'refs/tags/v')
              env:
                  RELEASE_TAG: ${{ github.ref_name }}
              run: |
                  version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' apps/desktop/src-tauri/target/release/bundle/macos/RustCode.app/Contents/Info.plist)
                  test "$RELEASE_TAG" = "v$version"

            - name: Notarize and staple RustCode.app
              if: steps.signing.outputs.enabled == 'true'
              env:
                  MACOS_DEVELOPER_ID_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
                  MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
                  MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
                  MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
                  MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
              run: scripts/macos-release-signing.sh notarize apps/desktop/src-tauri/target/release/bundle/macos/RustCode.app

            # RustCode-<ver>-macos-aarch64.app.zip, the asset the app's updater downloads.
            - name: Zip RustCode.app
              run: |
                  (cd apps/desktop && bun scripts/release-assets.ts ../../desktop-assets)

            # Check the asset as a user gets it: unpacked from the zip, with
            # the quarantine flag a browser download sets.
            - name: Verify downloaded app with Gatekeeper
              if: steps.signing.outputs.enabled == 'true'
              run: |
                  check="$RUNNER_TEMP/gatekeeper-check"
                  rm -rf "$check" && mkdir -p "$check"
                  ditto -x -k desktop-assets/RustCode-*-macos-aarch64.app.zip "$check"
                  xattr -w com.apple.quarantine "0083;$(printf '%x' "$(date +%s)");Safari;" "$check/RustCode.app"
                  xcrun stapler validate "$check/RustCode.app"
                  spctl --assess --type execute --verbose=4 "$check/RustCode.app"
                  codesign --verify --deep --strict --verbose=2 "$check/RustCode.app"

            - name: Remove signing keychain
              if: always() && steps.signing.outputs.enabled == 'true'
              run: scripts/macos-release-signing.sh cleanup

            - name: Upload app artifact
              uses: actions/upload-artifact@v7
              with:
                  name: rustcode-macos-aarch64-app
                  path: desktop-assets/*.zip

    # The desktop app's Windows installer and Linux packages, from the engine
    # artifacts of the `build` job. Skipped for a beta, like `build`.
    desktop:
        # Starts with the engine build, like desktop-macos.
        needs: verify-tag
        if: (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && !(startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-'))
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: windows-latest
                      engine: rustcode-windows-x86_64
                      triple: x86_64-pc-windows-msvc
                      bundles: nsis
                    - os: ubuntu-24.04
                      engine: rustcode-linux-x86_64
                      triple: x86_64-unknown-linux-gnu
                      bundles: appimage,deb
        env:
            # linuxdeploy (the AppImage bundler) without FUSE, and without its
            # strip, which cannot read Ubuntu 24.04's newer ELF sections.
            APPIMAGE_EXTRACT_AND_RUN: "1"
            NO_STRIP: "true"
        steps:
            - uses: actions/checkout@v7

            - name: Install Linux build dependencies
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf file

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.14

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable

            - name: Cache the shell crate
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: apps/desktop/src-tauri

            - name: Configure shared compiler cache
              uses: mozilla-actions/sccache-action@v0.0.11

            - name: Compile the app while the engine builds
              shell: bash
              working-directory: apps/desktop
              run: |
                  mkdir -p src-tauri/binaries
                  sidecar=src-tauri/binaries/rustcode-${{ matrix.triple }}
                  if [ "$RUNNER_OS" = Windows ]; then sidecar="$sidecar.exe"; fi
                  printf 'placeholder\n' > "$sidecar"
                  chmod 755 "$sidecar"
                  bun install --frozen-lockfile
                  bun run bundle:app --no-bundle

            # Waits for the engine artifact of this run (the desktop app compiled meanwhile).
            - name: Wait for the engine build
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
                  ARTIFACT: ${{ matrix.engine }}
              run: |
                  for _ in $(seq 1 160); do
                      names="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" --jq '.artifacts[].name')"
                      if grep -qx "$ARTIFACT" <<<"$names"; then exit 0; fi
                      failed="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" --jq '[.jobs[] | select((.name | contains(env.ARTIFACT)) and (.conclusion == "failure" or .conclusion == "cancelled"))] | length')"
                      if [ "$failed" != 0 ]; then echo "The engine build for $ARTIFACT failed."; exit 1; fi
                      sleep 15
                  done
                  echo "The engine artifact $ARTIFACT did not appear in 40 minutes."
                  exit 1

            - name: Download engine archive
              uses: actions/download-artifact@v8
              with:
                  name: ${{ matrix.engine }}
                  path: engine

            - name: Place the engine sidecar
              shell: bash
              run: |
                  if [ "$RUNNER_OS" = Windows ]; then
                      7z x -oengine engine/${{ matrix.engine }}.zip
                      cp engine/${{ matrix.engine }}.exe apps/desktop/src-tauri/binaries/rustcode-${{ matrix.triple }}.exe
                  else
                      tar xzf engine/${{ matrix.engine }}.tar.gz -C engine
                      install -m 755 engine/${{ matrix.engine }} apps/desktop/src-tauri/binaries/rustcode-${{ matrix.triple }}
                  fi

            - name: Build the installer
              shell: bash
              working-directory: apps/desktop
              run: |
                  bun install --frozen-lockfile
                  bun run bundle:app --bundles ${{ matrix.bundles }}
                  bun scripts/release-assets.ts ../../desktop-assets

            - name: Upload installer artifact
              uses: actions/upload-artifact@v7
              with:
                  name: rustcode-desktop-${{ runner.os }}
                  path: desktop-assets/*

    # Published as soon as the macOS CLI and app are ready: Homebrew and the
    # updaters need only those. release-rest attaches the other platforms.
    release:
        if: startsWith(github.ref, 'refs/tags/v')
        needs: [build-macos, desktop-macos]
        runs-on: ubuntu-latest
        steps:
            - name: Download macOS artifacts
              uses: actions/download-artifact@v8
              with:
                  path: artifacts
                  pattern: rustcode-macos-*
                  merge-multiple: true

            - name: Generate SHA256 manifest
              shell: bash
              run: |
                  set -euo pipefail
                  cd artifacts
                  version="${GITHUB_REF_NAME#v}"
                  files=(
                      "RustCode-${version}-macos-aarch64.app.zip"
                      rustcode-macos-aarch64.tar.gz
                  )
                  for file in "${files[@]}"; do
                      test -f "$file"
                  done
                  sha256sum "${files[@]}" | LC_ALL=C sort -k2,2 > SHA256SUMS

            - name: Create GitHub Release
              id: create_release
              uses: softprops/action-gh-release@v2
              with:
                  files: |
                      artifacts/SHA256SUMS
                      artifacts/*.tar.gz
                      artifacts/*.zip
                  generate_release_notes: true
                  # A beta is a prerelease: `releases/latest`,
                  # which both updaters read, skips it.
                  prerelease: ${{ contains(github.ref_name, '-') }}
                  make_latest: ${{ !contains(github.ref_name, '-') }}

            - name: Update Homebrew Formula
              if: ${{ !contains(github.ref_name, '-') }}
              env:
                  TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
                  TAG: ${{ github.ref_name }}
                  GH_USER: "lhagfoss"
              run: |
                  # 1. Read the platform-specific hashes from the published manifest.
                  ARM_SHA256=$(awk '$2 == "rustcode-macos-aarch64.tar.gz" {print $1}' artifacts/SHA256SUMS)
                  test -n "$ARM_SHA256"
                  echo "Computed ARM64 SHA256: $ARM_SHA256"

                  # 2. Clone your tap repository
                  git clone "https://x-access-token:${TAP_TOKEN}@github.com/${GH_USER}/homebrew-tap.git" tap-repo
                  cd tap-repo

                  # 3. Create Formula directory if it doesn't exist yet
                  mkdir -p Formula

                  # 4. Overwrite the formula file with the latest release info
                  cat <<EOF > Formula/rustcode.rb
                  class Rustcode < Formula
                      desc "Local LLM Agent Harness"
                      homepage "https://github.com/${GH_USER}/rustcode"
                      url "https://github.com/${GH_USER}/rustcode/releases/download/${TAG}/rustcode-macos-aarch64.tar.gz"
                      sha256 "${ARM_SHA256}"
                      depends_on arch: :arm64

                      version "${TAG/v/}"

                      def install
                          bin.install "rustcode-macos-aarch64" => "rustcode"
                      end
                  end
                  EOF

                  # 5. Commit and push the formula changes back to your tap repo
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git add Formula/rustcode.rb
                  git commit -m "Update rustcode to ${TAG}"
                  git push origin main

    # The other platforms, added to the release once they finish, with the
    # manifest rewritten to cover every asset.
    release-rest:
        if: ${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
        needs: [release, build, desktop]
        runs-on: ubuntu-latest
        steps:
            - name: Download artifacts
              uses: actions/download-artifact@v8
              with:
                  path: artifacts
                  merge-multiple: true

            - name: Generate SHA256 manifest
              shell: bash
              run: |
                  set -euo pipefail
                  cd artifacts
                  version="${GITHUB_REF_NAME#v}"
                  files=(
                      "RustCode-${version}-linux-x86_64.AppImage"
                      "RustCode-${version}-linux-x86_64.deb"
                      "RustCode-${version}-macos-aarch64.app.zip"
                      "RustCode-${version}-windows-x64-setup.exe"
                      rustcode-linux-aarch64.tar.gz
                      rustcode-linux-x86_64.tar.gz
                      rustcode-macos-aarch64.tar.gz
                      rustcode-windows-x86_64.zip
                  )
                  for file in "${files[@]}"; do
                      test -f "$file"
                  done
                  sha256sum "${files[@]}" | LC_ALL=C sort -k2,2 > SHA256SUMS

            - name: Attach the remaining assets
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ github.ref_name }}
              run: |
                  cd artifacts
                  gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
                      SHA256SUMS \
                      rustcode-linux-aarch64.tar.gz rustcode-linux-x86_64.tar.gz \
                      rustcode-windows-x86_64.zip \
                      "RustCode-${TAG#v}-windows-x64-setup.exe" \
                      "RustCode-${TAG#v}-linux-x86_64.AppImage" "RustCode-${TAG#v}-linux-x86_64.deb"
