name: PR labels

# Keeps release-note categories populated by mapping the Conventional Commit
# prefix in a PR title (see AGENTS.md) to repository labels, which
# .github/release.yml groups into the generated changelog.
#
#   feat(engine): …   -> feature
#   fix(tui): …       -> fix
#   chore: …          -> chore
#   feat(engine)!: …  -> feature + breaking
on:
    pull_request:
        types: [opened, edited, reopened, synchronize]

permissions:
    contents: read
    pull-requests: write
    issues: write

jobs:
    label:
        runs-on: ubuntu-latest
        steps:
            - name: Label from Conventional Commit prefix
              uses: actions/github-script@v7
              with:
                  script: |
                      const LABELS = {
                        feat: 'feature',
                        fix: 'fix',
                        perf: 'performance',
                        refactor: 'refactor',
                        docs: 'documentation',
                        test: 'test',
                        chore: 'chore',
                        ci: 'ci',
                        build: 'build',
                      };

                      const title = context.payload.pull_request.title.trim();
                      const match = title.match(/^([a-zA-Z]+)(\([^)]*\))?(!)?:/);
                      if (!match) {
                        core.info(`No Conventional Commit prefix in title: "${title}"`);
                        return;
                      }

                      const type = match[1].toLowerCase();
                      const breaking = match[3] === '!';

                      const wanted = [];
                      if (LABELS[type]) wanted.push(LABELS[type]);
                      if (breaking) wanted.push('breaking');
                      if (wanted.length === 0) {
                        core.info(`No label mapping for type "${type}"`);
                        return;
                      }

                      const issue_number = context.payload.pull_request.number;
                      const { owner, repo } = context.repo;

                      const existing = await github.paginate(
                        github.rest.issues.listLabelsOnIssue,
                        { owner, repo, issue_number, per_page: 100 },
                      );
                      const current = existing.map((l) => l.name);
                      const toAdd = wanted.filter((l) => !current.includes(l));

                      for (const label of toAdd) {
                        try {
                          await github.rest.issues.getLabel({ owner, repo, name: label });
                        } catch (e) {
                          // Create the label if it is missing so the run does not fail.
                          await github.rest.issues.createLabel({
                            owner,
                            repo,
                            name: label,
                            color: 'ededed',
                          });
                        }
                      }

                      if (toAdd.length > 0) {
                        await github.rest.issues.addLabels({
                          owner,
                          repo,
                          issue_number,
                          labels: toAdd,
                        });
                        core.info(`Added labels: ${toAdd.join(', ')}`);
                      } else {
                        core.info('No new labels to add.');
                      }
