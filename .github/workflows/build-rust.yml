# The Rust release build for a set of targets, shared by build.yml's macOS
# and Linux/Windows jobs so the macOS app and the release can start as soon
# as the macOS binary is ready instead of waiting for the slowest platform.
name: Build Rust

on:
    workflow_call:
        inputs:
            matrix:
                description: JSON list of {os, target, name}
                required: true
                type: string

permissions:
    contents: read

env:
    CARGO_TERM_COLOR: always
    SCCACHE_GHA_ENABLED: "true"
    RUSTC_WRAPPER: "sccache"

jobs:
    build:
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include: ${{ fromJSON(inputs.matrix) }}

        steps:
            - uses: actions/checkout@v7

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.target }}

            - name: Rust Cache
              uses: Swatinem/rust-cache@v2
              with:
                  shared-key: ${{ matrix.target }}

            - name: Configure shared compiler cache
              uses: mozilla-actions/sccache-action@v0.0.11

            - name: Set up mold linker (Linux)
              if: runner.os == 'Linux'
              uses: rui314/setup-mold@v1

            - name: Build release
              shell: bash
              env:
                  # ThinLTO makes the Windows MSVC release link disproportionately slow.
                  # Keep the optimized release profile, but skip LTO for this platform.
                  CARGO_PROFILE_RELEASE_LTO: ${{ runner.os == 'Windows' && 'off' || 'thin' }}
                  # No sccache on Windows: the engine's rustc command line is
                  # past Windows' 32 KiB limit, and cargo's @argfile fallback
                  # does not survive the wrapper ("The filename or extension
                  # is too long", os error 206). An empty wrapper turns it off.
                  RUSTC_WRAPPER: ${{ runner.os != 'Windows' && 'sccache' || '' }}
              # Build both shipping binaries: `rc` (orchestrator CLI and desktop
              # sidecar, zero TUI deps) and `rustcode` (standalone TUI harness).
              run: cargo build --locked --release --target ${{ matrix.target }} -p rustcode-cli --bin rc -p rustcode-harness --bin rustcode

            - name: Show compiler cache stats
              if: always()
              shell: bash
              run: ${SCCACHE_PATH} --show-stats

            # Developer ID signing switches on once all five MACOS_* secrets
            # exist (docs/macos-release-signing.md); until then the binary
            # ships as the linker signed it and this prints a notice.
            - name: Check macOS signing secrets
              id: signing
              if: (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && runner.os == 'macOS'
              shell: bash
              env:
                  MACOS_DEVELOPER_ID_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
                  MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
                  MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
                  MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
                  MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
              run: scripts/macos-release-signing.sh check

            - name: Import Developer ID certificate
              if: steps.signing.outputs.enabled == 'true'
              shell: bash
              env:
                  MACOS_DEVELOPER_ID_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
                  MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
                  MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
                  MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
                  MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
              run: scripts/macos-release-signing.sh import

            # A bare executable cannot be stapled: it is signed and submitted,
            # and Gatekeeper finds the ticket online.
            - name: Sign and notarize macOS binaries
              if: steps.signing.outputs.enabled == 'true'
              shell: bash
              env:
                  MACOS_DEVELOPER_ID_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
                  MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
                  MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
                  MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
                  MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
              run: |
                  scripts/macos-release-signing.sh sign target/${{ matrix.target }}/release/rc
                  scripts/macos-release-signing.sh sign target/${{ matrix.target }}/release/rustcode
                  mkdir -p "$RUNNER_TEMP/notarize-bins"
                  cp target/${{ matrix.target }}/release/rc target/${{ matrix.target }}/release/rustcode "$RUNNER_TEMP/notarize-bins/"
                  ditto -c -k --keepParent "$RUNNER_TEMP/notarize-bins" "$RUNNER_TEMP/rustcode-cli-notarize.zip"
                  scripts/macos-release-signing.sh notarize "$RUNNER_TEMP/rustcode-cli-notarize.zip"

            - name: Remove signing keychain
              if: always() && steps.signing.outputs.enabled == 'true'
              shell: bash
              run: scripts/macos-release-signing.sh cleanup

            - name: Package Linux / macOS binaries
              if: (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && runner.os != 'Windows'
              shell: bash
              run: |
                  rc_name="${{ matrix.name }}"
                  rc_name="rc-${rc_name#rustcode-}"
                  cp target/${{ matrix.target }}/release/rc "$rc_name"
                  chmod +x "$rc_name"
                  # rc 1.45.0 and older take the first `rustcode*` entry of
                  # its own archive, so `rc --update` failed with "could not
                  # find rustcode executable inside archive". This copy keeps
                  # them updating; newer updaters only take `rc`/`rc-*`. Drop
                  # it once no machine runs 1.45.0 or older.
                  cp "$rc_name" rustcode_rc
                  tar czf "${rc_name}.tar.gz" -C . "$rc_name" rustcode_rc
                  cp target/${{ matrix.target }}/release/rustcode ${{ matrix.name }}
                  chmod +x ${{ matrix.name }}
                  tar czf ${{ matrix.name }}.tar.gz -C . ${{ matrix.name }}

            - name: Package Windows binaries
              if: (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && runner.os == 'Windows'
              shell: powershell
              run: |
                  $rcName = "rc-" + ("${{ matrix.name }}" -replace '^rustcode-', '')
                  Copy-Item "target/${{ matrix.target }}/release/rc.exe" "$rcName.exe"
                  # Older updaters look for `rustcode*.exe`; see the Linux / macOS step.
                  Copy-Item "$rcName.exe" "rustcode_rc.exe"
                  Compress-Archive -Path "$rcName.exe", "rustcode_rc.exe" -DestinationPath "$rcName.zip"
                  Copy-Item "target/${{ matrix.target }}/release/rustcode.exe" "${{ matrix.name }}.exe"
                  Compress-Archive -Path "${{ matrix.name }}.exe" -DestinationPath "${{ matrix.name }}.zip"

            - name: Upload artifact
              if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
              uses: actions/upload-artifact@v7
              with:
                  name: ${{ matrix.name }}
                  # Each runner produces only one archive format (tar.gz or zip),
                  # holding both `rc` (orchestrator CLI) and `rustcode` (harness).
                  path: |
                      ${{ matrix.name }}.tar.gz
                      ${{ matrix.name }}.zip
                      rc-*.tar.gz
                      rc-*.zip

