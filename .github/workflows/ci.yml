name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Test remote client and contract
        run: swift test --package-path RustCodeRemote
      - name: Test local release helpers without hardware
        run: python3 tests/test_ios_release_helpers.py
      - name: Build iOS Simulator app
        run: >-
          xcodebuild -quiet -project RustCode.xcodeproj -scheme RustCode
          -destination 'generic/platform=iOS Simulator'
          build CODE_SIGNING_ALLOWED=NO DEVELOPMENT_TEAM=
