name: CI

on:
    pull_request:
        branches: [main]
    # Merges build the caches every pull request restores: GitHub lets a PR read
    # its own ref and its base branch, never another PR. Without this each PR's
    # first run compiled every dependency from scratch.
    push:
        branches: [main]
        paths:
            - .cargo/**
            - .github/workflows/ci.yml
            - Cargo.lock
            - Cargo.toml
            - rust-toolchain*
            - rustcode/**
            - "!rustcode/**/*.md"
    workflow_dispatch:

concurrency:
    group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    # A run on main has to finish to save its cache, so merges queue instead of
    # cancelling each other. GitHub keeps only the newest one waiting.
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
    CARGO_TERM_COLOR: always
    # CI does not archive debug symbols. Avoid spending time generating and
    # linking them for ephemeral checks and test binaries.
    CARGO_PROFILE_DEV_DEBUG: "0"
    CARGO_PROFILE_TEST_DEBUG: "0"
    # No sccache: it stores each object through the Actions cache API, which
    # throttled about 80% of its writes and then rust-cache's own save.

permissions:
    contents: read

jobs:
    changes:
        name: detect relevant changes
        runs-on: ubuntu-24.04
        permissions:
            # The changed paths come from the pull request's file list, so no
            # clone of the repository or its history is needed to diff it.
            contents: read
            pull-requests: read
        outputs:
            code: ${{ steps.filter.outputs.code }}
            packages: ${{ steps.filter.outputs.packages }}
            scripts: ${{ steps.filter.outputs.scripts }}
            seatbelt: ${{ steps.filter.outputs.seatbelt }}
        steps:
            - name: Check out the change matchers
              if: github.event_name == 'pull_request'
              uses: actions/checkout@v7
              with:
                  # The matchers under scripts/ are what runs next, and nothing
                  # else is needed: one commit of that directory instead of the
                  # whole history. Their self-tests run in the lint job. A
                  # release PR repeats this below with the full history.
                  fetch-depth: 1
                  sparse-checkout: scripts

            - name: List the changed files
              id: files
              if: github.event_name == 'pull_request'
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  changed_files="$RUNNER_TEMP/changed-files"
                  gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files \
                      --paginate --jq '.[].filename' > "$changed_files"
                  # The files API stops at 3000 entries, so a list that long is
                  # not the whole change: run everything rather than guess.
                  if [[ "$(wc -l < "$changed_files")" -ge 3000 ]]; then
                      echo "The file list is truncated; treating every check as relevant"
                      echo "truncated=true" >> "$GITHUB_OUTPUT"
                      echo "release_metadata=false" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi
                  echo "truncated=false" >> "$GITHUB_OUTPUT"
                  # A release PR touches only version literals and the changelog.
                  # The paths are all this step can see, so the prefilter only
                  # rules a PR out; the filter step rechecks the diff against
                  # scripts/ci-version-only.sh under the full checkout below.
                  if [[ -s "$changed_files" ]] &&
                      bash scripts/ci-version-only.sh --prefilter < "$changed_files"; then
                      echo "release_metadata=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "release_metadata=false" >> "$GITHUB_OUTPUT"
                  fi

            - name: Check out the release metadata diff
              # The full history to diff the version literals against, and the
              # matcher to read it: the diff needs objects, not a worktree.
              if: github.event_name == 'pull_request' && steps.files.outputs.release_metadata == 'true'
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  sparse-checkout: scripts

            - name: Check out repository
              if: github.event_name != 'pull_request'
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Check changed paths
              id: filter
              shell: bash
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  RELEASE_METADATA: ${{ steps.files.outputs.release_metadata }}
                  TRUNCATED: ${{ steps.files.outputs.truncated }}
              run: |
                  if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
                      echo "code=true" >> "$GITHUB_OUTPUT"
                      echo "packages=--workspace" >> "$GITHUB_OUTPUT"
                      echo "scripts=true" >> "$GITHUB_OUTPUT"
                      echo "seatbelt=true" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi
                  if [[ "$TRUNCATED" == "true" ]]; then
                      echo "code=true" >> "$GITHUB_OUTPUT"
                      echo "packages=--workspace" >> "$GITHUB_OUTPUT"
                      echo "scripts=true" >> "$GITHUB_OUTPUT"
                      echo "seatbelt=true" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi

                  changed_files="$(< "$RUNNER_TEMP/changed-files")"
                  if [[ "$RELEASE_METADATA" == "true" ]] && bash scripts/ci-version-only.sh "$BASE_SHA"; then
                      packages=""
                      echo "Release metadata only; reusing checks from the code PR"
                  else
                      packages="$(bash scripts/ci-affected-packages.sh <<< "$changed_files")"
                  fi
                  echo "packages=$packages" >> "$GITHUB_OUTPUT"
                  if [[ -n "$packages" ]] && grep -Eq '^(Cargo\.(toml|lock)$|rust-toolchain|\.cargo/|rustcode/engine/|rustcode/core/(rustcode-tools|rustcode-tool-protocol)/|src/|tests/)' <<< "$changed_files"; then
                      echo "seatbelt=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "seatbelt=false" >> "$GITHUB_OUTPUT"
                  fi
                  if grep -Eq '^scripts/' <<< "$changed_files"; then
                      echo "scripts=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "scripts=false" >> "$GITHUB_OUTPUT"
                  fi
                  if bash scripts/ci-relevant-changes.sh <<< "$changed_files"; then
                      echo "Relevant code or build files changed"
                      echo "code=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "No relevant code or build files changed"
                      echo "code=false" >> "$GITHUB_OUTPUT"
                  fi

    test:
        # Keep this context name stable: branch protection requires nothing on
        # main, so scripts/pr-merge.sh waits for every non-advisory check by
        # name, this one included.
        needs: changes
        name: test
        runs-on: ubuntu-24.04
        # Healthy runs finish in ~6min. A hung runner or wedged test must
        # fail fast instead of burning the 6h default (seen 20min+ stuck).
        timeout-minutes: 20
        env:
            AFFECTED_PACKAGES: ${{ needs.changes.outputs.packages }}
        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Install Rust toolchain
              if: env.AFFECTED_PACKAGES != ''
              uses: dtolnay/rust-toolchain@stable

            - name: Rust Cache
              if: env.AFFECTED_PACKAGES != ''
              uses: Swatinem/rust-cache@v2
              with:
                  # Its own key: clippy's check-only artifacts are no use to
                  # `cargo test`, and with one shared key lint finished first
                  # and test could not save.
                  shared-key: linux
                  env-vars: "CARGO CC CFLAGS CXX CMAKE RUSTC RUSTDOC RUSTUP"
                  save-if: ${{ github.ref == 'refs/heads/main' }}
                  # A failing test says nothing about the compiled dependencies.
                  cache-on-failure: true

            - name: Install bubblewrap
              if: env.AFFECTED_PACKAGES != ''
              run: |
                  sudo apt-get update
                  sudo apt-get install --no-install-recommends -y bubblewrap

            - name: Run tests
              if: env.AFFECTED_PACKAGES != ''
              # These tests depend on user-installed skills or runner-specific
              # ripgrep output. Keep them in the local suite, but exclude them
              # from the clean-runner gate until they have portable fixtures.
              # Test only packages with changed source. Workspace build inputs
              # (Cargo manifests/lock/toolchain) still select the full suite.
              # Sandbox-gated tests skip themselves when bubblewrap cannot run
              # (GitHub runners block unprivileged user namespaces).
              shell: bash
              run: |
                  read -ra packages <<< "$AFFECTED_PACKAGES"
                  cargo test --locked "${packages[@]}" -- \
                      --skip control_plane_tool_does_not_stall_while_reading_workspace_root \
                      --skip grep_stops_at_byte_cap_for_large_matching_lines

    lint:
        # Keep linting separate from the test job so the expensive compiler
        # work runs in parallel. Branch protection requires nothing on main;
        # scripts/pr-merge.sh waits for every non-advisory check, this one and
        # `test` included, before merging.
        needs: changes
        name: lint
        runs-on: ubuntu-24.04
        env:
            AFFECTED_PACKAGES: ${{ needs.changes.outputs.packages }}
        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Install Rust toolchain
              if: env.AFFECTED_PACKAGES != ''
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: rustfmt

            - name: Rust Cache
              if: env.AFFECTED_PACKAGES != ''
              uses: Swatinem/rust-cache@v2
              with:
                  shared-key: linux-lint
                  env-vars: "CARGO CC CFLAGS CXX CMAKE RUSTC RUSTDOC RUSTUP"
                  save-if: ${{ github.ref == 'refs/heads/main' }}

            - name: Check formatting
              if: env.AFFECTED_PACKAGES != ''
              run: cargo fmt --all -- --check

            # The installer and the change matchers under scripts/ test
            # themselves. Only a change to them can break those tests, and any
            # scripts/ change sets `scripts`, so they run on the PR that
            # changes them.
            - name: Check shell installer syntax
              if: needs.changes.outputs.scripts == 'true'
              run: bash -n scripts/install.sh

            - name: Check CI change matcher
              if: needs.changes.outputs.scripts == 'true'
              run: bash scripts/test-ci-relevant-changes.sh

            - name: Check affected package matcher
              if: needs.changes.outputs.scripts == 'true'
              run: bash scripts/test-ci-affected-packages.sh

            - name: Check version-only matcher
              if: needs.changes.outputs.scripts == 'true'
              run: bash scripts/test-ci-version-only.sh

            - name: Clippy correctness gate
              if: env.AFFECTED_PACKAGES != ''
              # The codebase has an established warning baseline. Keep those
              # warnings visible locally while denying only correctness lints.
              shell: bash
              run: |
                  read -ra packages <<< "$AFFECTED_PACKAGES"
                  cargo clippy --locked "${packages[@]}" -- -A warnings -D clippy::correctness

            - name: Check the TUI stays behind the frontend seam
              if: needs.changes.outputs.code == 'true'
              # The render layer may only reach core through
              # rustcode::controller, plus the convergence allow-list in
              # scripts/frontend-seam-allowlist.txt (issue #1431).
              run: bash scripts/check-frontend-seam.sh

            - name: Test the frontend-seam guard
              if: needs.changes.outputs.code == 'true'
              run: bash scripts/test-check-frontend-seam.sh

    macos-seatbelt:
        needs: changes
        if: needs.changes.outputs.seatbelt == 'true'
        name: macOS Seatbelt
        runs-on: macos-15
        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable

            - name: Rust Cache
              uses: Swatinem/rust-cache@v2
              with:
                  shared-key: macos-seatbelt
                  env-vars: "CARGO CC CFLAGS CXX CMAKE RUSTC RUSTDOC RUSTUP"
                  save-if: ${{ github.ref == 'refs/heads/main' }}
                  cache-on-failure: true

            # `cargo test` compiles what it runs; a separate `cargo check --tests`
            # first compiled the crate a second time (~5 of this job's 10 min).
            # The Linux `test` job compiles every test target.
            - name: Test Seatbelt enforcement
              run: cargo test --locked --lib tools::exec::sandbox::tests -- --test-threads=1

    portability:
        name: ${{ matrix.name }} portability coverage
        needs: changes
        if: needs.changes.outputs.packages != ''
        # Linux is the required quality gate. Native platform checks remain
        # visible and actionable without delaying or blocking a merge.
        continue-on-error: true
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: macOS
                      os: macos-latest
                      cache_key: macos
                    - name: Windows
                      os: windows-latest
                      cache_key: windows
        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Check PowerShell installer syntax
              if: runner.os == 'Windows'
              shell: pwsh
              run: |
                  $tokens = $null
                  $errors = $null
                  $path = Join-Path $PWD "scripts/install.ps1"
                  $null = [System.Management.Automation.Language.Parser]::ParseFile(
                      $path,
                      [ref]$tokens,
                      [ref]$errors
                  )
                  if ($errors.Count -gt 0) {
                      $errors | ForEach-Object { Write-Error $_.Message }
                      exit 1
                  }
                  Write-Output "PowerShell syntax OK"

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable

            - name: Rust Cache
              uses: Swatinem/rust-cache@v2
              with:
                  shared-key: ${{ matrix.cache_key }}
                  save-if: ${{ github.ref == 'refs/heads/main' }}

            - name: Check platform compilation
              # Linux runs the behavioral suite. These advisory jobs verify the
              # shipped binary's native macOS/Windows cfg without compiling or
              # linking the test harness again.
              shell: bash
              env:
                  AFFECTED_PACKAGES: ${{ needs.changes.outputs.packages }}
              run: |
                  read -ra packages <<< "$AFFECTED_PACKAGES"
                  cargo check --locked "${packages[@]}"

            - name: Test the fresh-profile migration checkpoint
              # The step above only compiles, and migrating user data depends
              # on the native file semantics: a flush through a reopened
              # read-only handle failed on Windows with "Access is denied",
              # which left a fresh profile unmigrated (#3118). One test target
              # runs that case for real, and it links only the library because
              # the library's own test modules hold unix-only assertions.
              if: runner.os == 'Windows'
              run: cargo test --locked --test storage_migrations_fresh_profile

            - name: Test Windows private file permissions
              if: runner.os == 'Windows'
              run: cargo test --locked --test private_files_windows

            - name: Test Windows scheduler daemon
              if: runner.os == 'Windows'
              run: cargo test --locked --test daemon_windows
