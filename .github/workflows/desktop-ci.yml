name: Desktop CI

# The Tauri desktop app in apps/desktop: the React UI (typecheck, lint, unit
# tests, Vite build) and its own Rust shell crate. It never builds the engine.
#
# The UI runs on Linux independently of the native shell checks. The shell
# keeps its macOS lint/tests and checks all targets on Linux and Windows.
on:
    pull_request:
        branches: [main]
        paths:
            - .github/workflows/desktop-ci.yml
            - .cargo/**
            - Cargo.toml
            - Cargo.lock
            - rust-toolchain*
            - rustcode/client/**
            - apps/desktop/**
    # Builds the caches pull requests restore (see ci.yml). Only what changes
    # them: a UI merge leaves the dependencies and the shell crate as they were.
    push:
        branches: [main]
        paths:
            - .github/workflows/desktop-ci.yml
            - .cargo/**
            - Cargo.toml
            - Cargo.lock
            - rust-toolchain*
            - rustcode/client/**
            - apps/desktop/bun.lock
            - apps/desktop/package.json
            - apps/desktop/src-tauri/**
    workflow_dispatch:

concurrency:
    group: desktop-ci-${{ github.event.pull_request.number || github.ref }}
    # A run on main has to finish to save its cache.
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

defaults:
    run:
        working-directory: apps/desktop

jobs:
    # Most changes here are UI: a TypeScript edit never needs the shell's
    # platform checks (Tauri and native bindings). Only a change under
    # src-tauri, or to what it builds from, runs that job.
    changes:
        name: detect shell changes
        runs-on: ubuntu-24.04
        permissions:
            # The changed paths come from the pull request's file list, so this
            # job checks nothing out.
            contents: read
            pull-requests: read
        defaults:
            run:
                # The workflow defaults the shell to apps/desktop, which a run
                # with no checkout does not have.
                working-directory: .
        outputs:
            shell: ${{ steps.filter.outputs.shell }}
        steps:
            - name: Check changed paths
              id: filter
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
                      echo "shell=true" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi
                  # Grep a file rather than a pipe: `grep -q` exits at the first
                  # match, and with `pipefail` the SIGPIPE that kills `gh api`
                  # would fail the step and report shell=false for a PR with
                  # more than one page of files.
                  changed="$RUNNER_TEMP/changed-files"
                  gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files \
                      --paginate --jq '.[].filename' > "$changed"
                  # The files API stops at 3000 entries, so a list that long is
                  # not the whole change: run the shell job rather than skip it.
                  if [[ "$(wc -l < "$changed")" -ge 3000 ]] ||
                      grep -Eq '^(apps/desktop/src-tauri/|apps/desktop/package\.json$|apps/desktop/bun\.lock$|rustcode/client/|\.cargo/|Cargo\.(toml|lock)$|rust-toolchain[^/]*$|\.github/workflows/desktop-ci\.yml$)' "$changed"; then
                      echo "The shell crate or what it builds from changed"
                      echo "shell=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "UI only; the shell crate is untouched"
                      echo "shell=false" >> "$GITHUB_OUTPUT"
                  fi

    ui:
        name: Desktop UI
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.14

            - name: Restore Bun's install cache
              uses: actions/cache@v5
              with:
                  path: ~/.bun/install/cache
                  key: bun-${{ runner.os }}-${{ hashFiles('apps/desktop/bun.lock') }}
                  restore-keys: bun-${{ runner.os }}-

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Typecheck, lint, test and build in parallel
              shell: bash
              run: |
                  # Share checkout/install overhead. Wait for every check even
                  # after a failure, and keep each command's output together.
                  checks=(typecheck lint test build)
                  pids=()
                  for check in "${checks[@]}"; do
                      bun run "$check" > "$RUNNER_TEMP/ui-$check.log" 2>&1 &
                      pids+=("$!")
                  done
                  failed=0
                  for i in "${!checks[@]}"; do
                      check="${checks[$i]}"
                      status=0
                      wait "${pids[$i]}" || status=$?
                      echo "::group::$check (exit $status)"
                      cat "$RUNNER_TEMP/ui-$check.log"
                      echo "::endgroup::"
                      if ((status != 0)); then
                          echo "::error::$check failed with exit $status"
                          failed=1
                      fi
                  done
                  exit "$failed"

            # The release bundle's version comes from the root Cargo.toml
            # (scripts/bundle-version.ts); the build in build.yml relies on it.
            - name: Check the release version config
              run: |
                  bun scripts/bundle-version.ts
                  test "$(bun scripts/bundle-version.ts)" = "$(sed -n 's/^version = "\(.*\)"/\1/p' ../../Cargo.toml | head -1)"

    shell:
        name: Desktop shell (${{ matrix.name }})
        needs: changes
        if: needs.changes.outputs.shell == 'true'
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: macOS
                      os: macos-26
                    - name: Linux
                      os: ubuntu-24.04
                    - name: Windows
                      os: windows-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v7

            - name: Install Linux shell dependencies
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

            - name: Install Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: clippy, rustfmt

            - name: Cache the shell crate
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: apps/desktop/src-tauri
                  save-if: ${{ github.ref == 'refs/heads/main' }}

            - name: Format
              if: runner.os == 'macOS'
              working-directory: apps/desktop/src-tauri
              run: cargo fmt --check

            - name: Check and lint the shell
              if: runner.os == 'macOS'
              working-directory: apps/desktop/src-tauri
              run: cargo clippy --locked --all-targets -- -D warnings

            - name: Check the shell on Linux and Windows
              if: runner.os != 'macOS'
              working-directory: apps/desktop/src-tauri
              run: cargo check --locked --all-targets

            - name: Test the shell
              if: runner.os == 'macOS'
              working-directory: apps/desktop/src-tauri
              run: cargo test --locked
