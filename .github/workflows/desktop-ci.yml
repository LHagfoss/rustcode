name: Desktop CI

# The Tauri desktop app in apps/desktop: the React UI (typecheck, lint, unit
# tests, Vite build) and its own Rust shell crate. It never builds the engine.
#
# The UI needs no macOS, so it runs on Linux beside the shell crate (objc2,
# WKWebView) on macOS instead of behind it: a TypeScript typecheck no longer
# waits for a macOS runner, and the two jobs finish in the time the slower one
# takes rather than one after the other.
on:
    pull_request:
        branches: [main]
        paths:
            - .github/workflows/desktop-ci.yml
            - apps/desktop/**
    workflow_dispatch:

concurrency:
    group: desktop-ci-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

defaults:
    run:
        working-directory: apps/desktop

jobs:
    ui:
        name: Desktop UI
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.14

            - name: Restore Bun's install cache
              uses: actions/cache@v5
              with:
                  path: ~/.bun/install/cache
                  key: bun-${{ runner.os }}-${{ hashFiles('apps/desktop/bun.lock') }}
                  restore-keys: bun-${{ runner.os }}-

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Typecheck
              run: bun run typecheck

            - name: Lint
              run: bun run lint

            - name: Unit tests
              run: bun run test

            - name: Build the UI
              run: bun run build

            # The release bundle's version comes from the root Cargo.toml
            # (scripts/bundle-version.ts); the build in build.yml relies on it.
            - name: Check the release version config
              run: |
                  bun scripts/bundle-version.ts
                  test "$(bun scripts/bundle-version.ts)" = "$(sed -n 's/^version = "\(.*\)"/\1/p' ../../Cargo.toml | head -1)"

    shell:
        name: Desktop shell
        runs-on: macos-26
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v7

            - name: Install Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: clippy, rustfmt

            - name: Cache the shell crate
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: apps/desktop/src-tauri

            - name: Format
              working-directory: apps/desktop/src-tauri
              run: cargo fmt --check

            - name: Check and lint the shell
              working-directory: apps/desktop/src-tauri
              run: cargo clippy --locked --all-targets -- -D warnings

            - name: Test the shell
              working-directory: apps/desktop/src-tauri
              run: cargo test --locked
