name: Desktop CI

# The Tauri desktop app in apps/desktop: the React UI (typecheck, lint, unit
# tests, Vite build) and its own Rust shell crate. It never builds the engine.
#
# The UI needs no macOS, so it runs on Linux beside the shell crate (objc2,
# WKWebView) on macOS instead of behind it: a TypeScript typecheck no longer
# waits for a macOS runner, and the two jobs finish in the time the slower one
# takes rather than one after the other.
on:
    pull_request:
        branches: [main]
        paths:
            - .github/workflows/desktop-ci.yml
            - apps/desktop/**
    # Builds the caches pull requests restore (see ci.yml). Only what changes
    # them: a UI merge leaves the dependencies and the shell crate as they were.
    push:
        branches: [main]
        paths:
            - .github/workflows/desktop-ci.yml
            - apps/desktop/bun.lock
            - apps/desktop/package.json
            - apps/desktop/src-tauri/**
    workflow_dispatch:

concurrency:
    group: desktop-ci-${{ github.event.pull_request.number || github.ref }}
    # A run on main has to finish to save its cache.
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

defaults:
    run:
        working-directory: apps/desktop

jobs:
    # Most changes here are UI: a TypeScript edit never needs the shell's
    # macOS compile (Tauri, objc2, WebKit bindings). Only a change under
    # src-tauri, or to what it builds from, runs that job.
    changes:
        name: detect shell changes
        runs-on: ubuntu-24.04
        permissions:
            # The changed paths come from the pull request's file list, so this
            # job checks nothing out.
            contents: read
            pull-requests: read
        defaults:
            run:
                # The workflow defaults the shell to apps/desktop, which a run
                # with no checkout does not have.
                working-directory: .
        outputs:
            shell: ${{ steps.filter.outputs.shell }}
        steps:
            - name: Check changed paths
              id: filter
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
                      echo "shell=true" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi
                  # Grep a file rather than a pipe: `grep -q` exits at the first
                  # match, and with `pipefail` the SIGPIPE that kills `gh api`
                  # would fail the step and report shell=false for a PR with
                  # more than one page of files.
                  changed="$RUNNER_TEMP/changed-files"
                  gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files \
                      --paginate --jq '.[].filename' > "$changed"
                  # The files API stops at 3000 entries, so a list that long is
                  # not the whole change: run the shell job rather than skip it.
                  if [[ "$(wc -l < "$changed")" -ge 3000 ]] ||
                      grep -Eq '^(apps/desktop/src-tauri/|apps/desktop/package\.json$|apps/desktop/bun\.lock$|\.github/workflows/desktop-ci\.yml$)' "$changed"; then
                      echo "The shell crate or what it builds from changed"
                      echo "shell=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "UI only; the shell crate is untouched"
                      echo "shell=false" >> "$GITHUB_OUTPUT"
                  fi

    ui:
        name: Desktop UI
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.14

            - name: Restore Bun's install cache
              uses: actions/cache@v5
              with:
                  path: ~/.bun/install/cache
                  key: bun-${{ runner.os }}-${{ hashFiles('apps/desktop/bun.lock') }}
                  restore-keys: bun-${{ runner.os }}-

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Typecheck
              run: bun run typecheck

            - name: Lint
              run: bun run lint

            - name: Unit tests
              run: bun run test

            - name: Build the UI
              run: bun run build

            # The release bundle's version comes from the root Cargo.toml
            # (scripts/bundle-version.ts); the build in build.yml relies on it.
            - name: Check the release version config
              run: |
                  bun scripts/bundle-version.ts
                  test "$(bun scripts/bundle-version.ts)" = "$(sed -n 's/^version = "\(.*\)"/\1/p' ../../Cargo.toml | head -1)"

    shell:
        name: Desktop shell
        needs: changes
        if: needs.changes.outputs.shell == 'true'
        runs-on: macos-26
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v7

            - name: Install Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: clippy, rustfmt

            - name: Cache the shell crate
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: apps/desktop/src-tauri
                  save-if: ${{ github.ref == 'refs/heads/main' }}

            - name: Format
              working-directory: apps/desktop/src-tauri
              run: cargo fmt --check

            - name: Check and lint the shell
              working-directory: apps/desktop/src-tauri
              run: cargo clippy --locked --all-targets -- -D warnings

            - name: Test the shell
              working-directory: apps/desktop/src-tauri
              run: cargo test --locked
