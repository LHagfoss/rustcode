name: Desktop CI

# The Tauri desktop app in apps/desktop: the React UI (typecheck, lint, unit
# tests, Vite build) and its own Rust shell crate. It never builds the engine,
# so it stays fast and runs only when the app or this workflow changes.
on:
    pull_request:
        branches: [main]
        paths:
            - .github/workflows/desktop-ci.yml
            - apps/desktop/**
    workflow_dispatch:

concurrency:
    group: desktop-ci-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    desktop:
        name: Desktop UI and shell
        runs-on: macos-26
        timeout-minutes: 20
        defaults:
            run:
                working-directory: apps/desktop
        steps:
            - name: Check out
              uses: actions/checkout@v7

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.14

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Typecheck
              run: bun run typecheck

            - name: Lint
              run: bun run lint

            - name: Unit tests
              run: bun run test

            - name: Build the UI
              run: bun run build

            - name: Install Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: clippy, rustfmt

            - name: Cache the shell crate
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: apps/desktop/src-tauri

            - name: Format
              working-directory: apps/desktop/src-tauri
              run: cargo fmt --check

            - name: Check and lint the shell
              working-directory: apps/desktop/src-tauri
              run: cargo clippy --locked --all-targets -- -D warnings

            - name: Test the shell
              working-directory: apps/desktop/src-tauri
              run: cargo test --locked
