name: macOS Swift CI

# The SwiftUI client in macos/ builds without Rust, so this stays fast and
# runs only when the Swift sources or this workflow change.
on:
    pull_request:
        branches: [main]
        paths:
            - .github/workflows/macos-swift-ci.yml
            - macos/**
            - scripts/package-swift-app.sh
            - scripts/macos-release-signing.sh
    workflow_dispatch:

concurrency:
    group: macos-swift-ci-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    swift:
        name: Swift build and test
        runs-on: macos-26
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7

            - name: Build
              run: swift build --package-path macos

            - name: Test
              run: swift test --package-path macos

            # Exercise the unsigned (ad-hoc) packaging path release builds
            # take until the Developer ID secrets exist; any executable
            # stands in for the engine.
            - name: Package ad-hoc signed app
              run: |
                  scripts/package-swift-app.sh /usr/bin/true target/swift-ci
                  codesign --verify --deep --strict --verbose=2 target/swift-ci/RustCode.app
                  bash -n scripts/macos-release-signing.sh
                  scripts/macos-release-signing.sh check
