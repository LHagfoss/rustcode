name: CodeQL

# Replaces GitHub's default CodeQL setup, which cannot cancel a superseded run:
# every merge started another 15+ minute Rust scan beside the ones still
# running. Merges do not wait for these checks (scripts/pr-merge.sh treats them
# as advisory); alerts land in the Security tab.
on:
    pull_request:
        branches: [main]
        paths-ignore:
            - "**/*.md"
            - docs/**
    push:
        branches: [main]
        paths-ignore:
            - "**/*.md"
            - docs/**
    schedule:
        - cron: "17 4 * * 1"
    workflow_dispatch:

concurrency:
    group: codeql-${{ github.event.pull_request.number || github.ref }}
    # Only the newest commit's scan matters, on a PR and on main alike.
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    analyze:
        name: Analyze (${{ matrix.language }})
        runs-on: ubuntu-latest
        timeout-minutes: 45
        permissions:
            contents: read
            security-events: write
            actions: read
        strategy:
            fail-fast: false
            matrix:
                language: [actions, javascript-typescript, python, rust]
        steps:
            - uses: actions/checkout@v7
            - uses: github/codeql-action/init@v4
              with:
                  languages: ${{ matrix.language }}
                  build-mode: none
            - uses: github/codeql-action/analyze@v4
              with:
                  category: /language:${{ matrix.language }}
