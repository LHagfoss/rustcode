name: Bug report
description: Something is broken or not working as expected
labels: [bug]
body:
    - type: textarea
      id: what
      attributes:
          label: What happened
          description: What did you expect, and what happened instead?
      validations:
          required: true
    - type: textarea
      id: steps
      attributes:
          label: Steps to reproduce
          placeholder: |
              1. Run `rustcode` in ...
              2. Ask ...
              3. See ...
    - type: textarea
      id: text
      attributes:
          label: Exact text
          description: |
              Paste the text involved: the error, the diff lines, the command, the
              message you sent. Screenshots help people, but an agent fixing the
              issue cannot see them.
          render: text
    - type: input
      id: version
      attributes:
          label: Version
          description: Output of `rustcode --version`
      validations:
          required: true
    - type: dropdown
      id: app
      attributes:
          label: Where
          options:
              - Terminal (TUI)
              - macOS app
              - iOS app / remote
              - ACP / editor
              - Other
      validations:
          required: true
    - type: input
      id: os
      attributes:
          label: OS
          placeholder: macOS 27, Ubuntu 24.04, Windows 11, ...
    - type: input
      id: model
      attributes:
          label: Provider and model
          placeholder: ChatGPT gpt-5, Ollama qwen3, ...
    - type: textarea
      id: logs
      attributes:
          label: Logs
          description: |
              If you can, attach `rustcode export` output or the relevant part of
              the session's `logs/debug.log` (`rustcode sessions path <id>` shows
              where it is). Check it for anything private first.
